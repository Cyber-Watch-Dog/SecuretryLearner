<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bug Bounty Azure Checklist with Commands</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 2rem;
      background: #121212;
      color: #f0f0f0;
    }
    h1 {
      color: #00ffae;
      text-align: center;
      margin-bottom: 2rem;
    }
    .section {
      margin-bottom: 2rem;
      background-color: #1f1f1f;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,255,174,0.3);
    }
    .section h2 {
      background: #00ffae;
      color: #121212;
      padding: 0.5rem 1rem;
      border-radius: 6px;
    }
    label {
      display: block;
      margin: 0.5rem 0;
      cursor: pointer;
    }
    code {
      background: #222;
      color: #00e1ff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    footer {
      text-align: center;
      margin-top: 4rem;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Mercedes-Benz Azure Bug Bounty Checklist + Commands</h1>

  <div class="section">
    <h2>Recon & Enumeration</h2>
    <label><input type="checkbox"> Subdomain Enumeration — <code>subfinder -d target.com -o subs.txt</code></label>
    <label><input type="checkbox"> Live Host Discovery — <code>httpx -l subs.txt -o live.txt</code></label>
    <label><input type="checkbox"> Port Scanning — <code>naabu -l live.txt -o ports.txt</code></label>
    <label><input type="checkbox"> Historical URLs — <code>cat subs.txt | gau > urls.txt</code></label>
    <label><input type="checkbox"> Parameter Discovery — <code>arjun -i urls.txt -o params.txt</code></label>
  </div>

  <div class="section">
    <h2>Web App Vulnerabilities</h2>
    <label><input type="checkbox"> XSS Testing — <code>dalfox file urls.txt</code></label>
    <label><input type="checkbox"> IDOR Checks — <code>Manual/BurpSuite testing</code></label>
    <label><input type="checkbox"> SSRF Testing — <code>gf ssrf urls.txt</code></label>
    <label><input type="checkbox"> Open Redirects — <code>gf redirect urls.txt</code></label>
    <label><input type="checkbox"> Path Traversal — <code>ffuf -w wordlist.txt -u https://site.com/FUZZ</code></label>
  </div>

  <div class="section">
    <h2>Azure-Specific Tests</h2>
    <label><input type="checkbox"> Azure Blob Storage Access — <code>azcopy list https://example.blob.core.windows.net/container</code></label>
    <label><input type="checkbox"> Azure App Services — <code>Visit *.azurewebsites.net and *.scm.azurewebsites.net</code></label>
    <label><input type="checkbox"> Azure Function API Check — <code>curl -X GET https://func.azurewebsites.net/api/test</code></label>
    <label><input type="checkbox"> Azure SSRF Metadata — <code>curl -H "Metadata:true" http://169.254.169.254/metadata/instance?api-version=2021-02-01</code></label>
  </div>

  <div class="section">
    <h2>Authentication & Tokens</h2>
    <label><input type="checkbox"> JWT Manipulation — <code>jwt_tool token.jwt</code></label>
    <label><input type="checkbox"> Session Checks — <code>Manual session testing (timeout, token reuse)</code></label>
    <label><input type="checkbox"> Cookie Scope — <code>Check Burp → Proxy → Cookies</code></label>
  </div>

  <div class="section">
    <h2>Lateral Movement</h2>
    <label><input type="checkbox"> Pivot via Low-Severity Issue — <code>Map flow using Burp history</code></label>
    <label><input type="checkbox"> Cross-domain Auth Abuse — <code>Replay tokens across *.mbos.* and *.azure.*</code></label>
  </div>

  <footer>
    Built for Advanced Bug Bounty Recon 🔍
  </footer>
</body>
</html>
