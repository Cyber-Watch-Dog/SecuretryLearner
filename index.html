<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bug Bounty Azure Checklist</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 2rem;
      background: #121212;
      color: #f0f0f0;
    }
    h1 {
      color: #00ffae;
      text-align: center;
      margin-bottom: 2rem;
    }
    .section {
      margin-bottom: 2rem;
      background-color: #1f1f1f;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,255,174,0.3);
    }
    .section h2 {
      background: #00ffae;
      color: #121212;
      padding: 0.5rem 1rem;
      border-radius: 6px;
    }
    label {
      display: block;
      margin: 0.5rem 0;
      cursor: pointer;
    }
    input[type="checkbox"] {
      margin-right: 0.75rem;
      transform: scale(1.2);
    }
    label:hover {
      color: #00ffae;
    }
    footer {
      text-align: center;
      margin-top: 4rem;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Mercedes-Benz Azure Bug Bounty Checklist</h1>

  <div class="section">
    <h2>Recon & Enumeration</h2>
    <label><input type="checkbox"> Subdomain Enumeration (subfinder, amass)</label>
    <label><input type="checkbox"> Live Host Discovery (httpx)</label>
    <label><input type="checkbox"> Port Scanning (naabu, nmap)</label>
    <label><input type="checkbox"> Historical URLs (gau, waybackurls)</label>
    <label><input type="checkbox"> Parameter Discovery (arjun, paramspider)</label>
  </div>

  <div class="section">
    <h2>Web App Vulnerabilities</h2>
    <label><input type="checkbox"> Test for XSS (dalfox, kxss)</label>
    <label><input type="checkbox"> Check for IDOR</label>
    <label><input type="checkbox"> SSRF Injection</label>
    <label><input type="checkbox"> Open Redirects</label>
    <label><input type="checkbox"> SQLi, RCE, Path Traversal</label>
  </div>

  <div class="section">
    <h2>Azure-Specific Tests</h2>
    <label><input type="checkbox"> Check Azure Blob Storage for open access</label>
    <label><input type="checkbox"> Analyze Azure App Services (*.azurewebsites.net)</label>
    <label><input type="checkbox"> Test Azure Functions APIs</label>
    <label><input type="checkbox"> SSRF to Metadata Service (169.254.169.254)</label>
  </div>

  <div class="section">
    <h2>Authentication & Tokens</h2>
    <label><input type="checkbox"> Test login flows and JWTs</label>
    <label><input type="checkbox"> Session fixation/timeout checks</label>
    <label><input type="checkbox"> Shared cookies across subdomains</label>
  </div>

  <div class="section">
    <h2>Lateral Movement</h2>
    <label><input type="checkbox"> Low-impact to high-impact chaining</label>
    <label><input type="checkbox"> Cross-subdomain token reuse</label>
  </div>

  <footer>
    Built for Azure Recon Hunters 🚀
  </footer>
</body>
</html>
